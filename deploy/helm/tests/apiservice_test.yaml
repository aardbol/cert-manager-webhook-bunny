suite: APIService
templates:
  - apiservice.yaml
tests:
  - it: creates an APIService with default values
    asserts:
      - isKind:
          of: APIService
      - equal:
          path: apiVersion
          value: apiregistration.k8s.io/v1
      - equal:
          path: metadata.name
          value: v1alpha1.bunny.aardbol.dev
      - equal:
          path: spec.group
          value: bunny.aardbol.dev
      - equal:
          path: spec.groupPriorityMinimum
          value: 1000
      - equal:
          path: spec.versionPriority
          value: 15
      - equal:
          path: spec.version
          value: v1alpha1

  - it: references the correct service
    asserts:
      - equal:
          path: spec.service.name
          value: RELEASE-NAME-cert-manager-webhook-bunny
      - equal:
          path: spec.service.namespace
          value: NAMESPACE

  - it: includes cert-manager injection annotation
    asserts:
      - equal:
          path: metadata.annotations
          value:
            cert-manager.io/inject-ca-from: NAMESPACE/RELEASE-NAME-cert-manager-webhook-bunny-webhook-tls
