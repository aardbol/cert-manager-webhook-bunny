name: Test

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
    paths:
      - '**/*.go'
      - go.mod
      - go.sum
      - '.github/workflows/test.yaml'
  pull_request:
    branches:
      - main
    paths:
      - '**/*.go'
      - go.mod
      - go.sum
      - '.github/workflows/test.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    uses: upcloud-tools/gha-actions/.github/workflows/test-go.yaml@c0df829cbad57268497db8cfb6174419f925b283
