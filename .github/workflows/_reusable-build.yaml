on:
  workflow_call:
    inputs:
      tags:
        required: true
        type: string

env:
  REGISTRY: ghcr.io

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        id: build-image
        uses: aardbol/buildah-build@2e50c6f6077d4783d9919f2cc07009f0d3a750cd # v3.1.0
        with:
          image: ${{ github.repository }}
          tags: ${{ inputs.tags }}
          containerfiles: ./Containerfile
          platforms: linux/amd64,linux/arm64
          extra-args: --pull=always

      - name: Push image
        id: push-image
        uses: aardbol-actions/push-to-registry@42cc3e1c55f48de848bcf5009ba3e502d7faa934 # v3.1.0
        with:
          image: ${{ steps.build-image.outputs.image }}
          tags: ${{ inputs.tags }}
          registry: ${{ env.REGISTRY }}

      - name: Build summary
        run: |
          echo "## Container image" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Image | \`${{ steps.build-image.outputs.image }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Tags | \`${{ inputs.tags }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Digest | \`${{ steps.push-image.outputs.digest }}\` |" >> "$GITHUB_STEP_SUMMARY"
