name: OpenSSF Scorecard

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

on:
  push:
    branches:
      - main
    paths:
      - '**/*.go'
      - go.mod
      - go.sum
      - build-image.sh
      - '.github/workflows/**'
      - '.golangci.yml'
      - '.trivyignore.yaml'
  schedule:
    - cron: "00 06 * * 1"

permissions:
  contents: read

jobs:
  analysis:
    permissions:
      contents: read
      security-events: write
      id-token: write
    uses: upcloud-tools/gha-actions/.github/workflows/scorecard.yaml@f2881d6a065803a93a5af104f83413f4b6f31ca0 # 2026-08-27
    secrets: inherit
