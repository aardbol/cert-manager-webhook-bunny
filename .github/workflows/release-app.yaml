name: Build and Release

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

on:
  push:
    branches:
      - main
    paths:
      - deploy/helm/Chart.yaml
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  GO_VERSION: '1.26.5'
  REGISTRY: ghcr.io

jobs:
  detect:
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    outputs:
      skip: ${{ steps.detect.outputs.skip }}
      app_version: ${{ steps.detect.outputs.app_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect appVersion bump
        id: detect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          app_version=$(yq '.appVersion' deploy/helm/Chart.yaml)
          echo "app_version=$app_version" >> "$GITHUB_OUTPUT"

          if gh release view "v$app_version" > /dev/null 2>&1; then
            echo "Release v$app_version already exists. Skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"

  build-image:
    needs: detect
    if: ${{ needs.detect.outputs.skip == 'false' }}
    uses: ./.github/workflows/_reusable-build.yaml
    with:
      tags: ${{ github.sha }}
    secrets: inherit
    permissions:
      contents: read
      packages: write

  integration:
    timeout-minutes: 15
    needs: detect
    if: ${{ needs.detect.outputs.skip == 'false' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run integration tests
        env:
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
          BUNNY_TEST_FQDN: ${{ secrets.BUNNY_TEST_FQDN }}
        run: make test-integration

  release:
    needs: [detect, build-image, integration]
    if: ${{ needs.detect.outputs.skip == 'false' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup ORAS
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag release
        run: |
          SRC="${{ env.REGISTRY }}/${{ github.repository }}:${{ github.sha }}"
          DST="${{ env.REGISTRY }}/${{ github.repository }}:v${{ needs.detect.outputs.app_version }}"
          LATEST="${{ env.REGISTRY }}/${{ github.repository }}:latest"
          oras copy "$SRC" "$DST"
          oras copy "$SRC" "$LATEST"

      - name: Setup Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the container image
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ github.repository }}:v${{ needs.detect.outputs.app_version }}"
          DIGEST=$(oras resolve "$IMAGE")
          cosign sign --yes "${{ env.REGISTRY }}/${{ github.repository }}@${DIGEST}"

      - name: Get release notes
        run: make release-notes TAG="${{ needs.detect.outputs.app_version }}" > .release_notes

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ needs.detect.outputs.app_version }}" \
            --notes-file .release_notes \
            --title "v${{ needs.detect.outputs.app_version }}" \
            --draft

      - name: Create git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v${{ needs.detect.outputs.app_version }}"
          git push origin "v${{ needs.detect.outputs.app_version }}"
