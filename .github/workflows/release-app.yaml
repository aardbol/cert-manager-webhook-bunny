name: Build and Release

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

on:
  push:
    branches:
      - main
    paths:
      - deploy/helm/Chart.yaml
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  detect:
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    outputs:
      skip: ${{ steps.detect.outputs.app_release_exists }}
      app_version: ${{ steps.detect.outputs.app_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - id: detect
        uses: ./.github/actions/detect-versions

  build-image:
    needs: detect
    if: ${{ needs.detect.outputs.skip == 'false' }}
    uses: ./.github/workflows/_reusable-build.yaml
    with:
      tags: ${{ github.sha }}
    secrets: inherit
    permissions:
      contents: read
      packages: write

  integration:
    timeout-minutes: 15
    needs: detect
    if: ${{ needs.detect.outputs.skip == 'false' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Run integration tests
        env:
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
          BUNNY_TEST_FQDN: ${{ secrets.BUNNY_TEST_FQDN }}
        run: make test-integration

  release:
    needs: [detect, build-image, integration]
    if: ${{ needs.detect.outputs.skip == 'false' }}
    uses: upcloud-tools/gha-actions/.github/workflows/release-container.yaml@c0df829cbad57268497db8cfb6174419f925b283
    with:
      app_version: ${{ needs.detect.outputs.app_version }}
    secrets: inherit
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
