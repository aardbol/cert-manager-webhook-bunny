name: CodeQL Go

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
    paths:
      - '**/*.go'
      - go.mod
      - go.sum
      - '.github/workflows/codeql-go.yaml'
  pull_request:
    branches:
      - main
    paths:
      - '**/*.go'
      - go.mod
      - go.sum
      - '.github/workflows/codeql-go.yaml'
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: upcloud-tools/gha-actions/.github/workflows/codeql-go.yaml@c0df829cbad57268497db8cfb6174419f925b283
    secrets: inherit
