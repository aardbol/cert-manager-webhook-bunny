name: Release Helm chart

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

on:
  push:
    branches:
      - main
    paths:
      - deploy/helm/Chart.yaml
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  CHART_DIR: deploy/helm
  GO_VERSION: '1.26.5'
  REGISTRY: ghcr.io
  CHART_OCI_REPO: ${{ github.repository_owner }}/charts

jobs:
  detect:
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    outputs:
      skip: ${{ steps.check.outputs.skip_release }}
      chart_version: ${{ steps.check.outputs.chart_version }}
      app_version_bumped: ${{ steps.check.outputs.app_version_bumped }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check version bump
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chart_version=$(yq '.version' "$CHART_DIR/Chart.yaml")
          app_version=$(yq '.appVersion' "$CHART_DIR/Chart.yaml")
          echo "chart_version=$chart_version" >> "$GITHUB_OUTPUT"

          if gh release view "helm-v$chart_version" > /dev/null 2>&1; then
            echo "Release helm-v$chart_version already exists. Skipping."
            echo "skip_release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "skip_release=false" >> "$GITHUB_OUTPUT"

          if gh release view "v$app_version" > /dev/null 2>&1; then
            echo "app_version_bumped=false" >> "$GITHUB_OUTPUT"
          else
            echo "Release v$app_version has changed, skipping integration here."
            echo "app_version_bumped=true" >> "$GITHUB_OUTPUT"
          fi

  integration:
    timeout-minutes: 15
    needs: detect
    if: ${{ needs.detect.outputs.skip_release == 'false' && needs.detect.outputs.app_version_bumped == 'false' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run integration tests
        env:
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
          BUNNY_TEST_FQDN: ${{ secrets.BUNNY_TEST_FQDN }}
        run: make test-integration

  release-helm:
    needs: [detect, integration]
    if: ${{ needs.detect.outputs.skip_release == 'false' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup ORAS
        uses: oras-project/setup-oras@38de303aac69abb66f3e6255b7198bff35f323e3 # v2.0.0

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get release notes
        run: make release-notes TAG="${{ needs.detect.outputs.chart_version }}" > .release_notes

      - name: Copy LICENSE and README into chart
        run: cp LICENSE README.md ${{ env.CHART_DIR }}/

      - name: Package chart
        run: |
          mkdir -p dist
          helm package ${{ env.CHART_DIR }} --destination dist

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign chart package
        run: |
          PACKAGE=$(ls dist/*.tgz)
          cosign sign-blob "$PACKAGE" --bundle "${PACKAGE}.sigstore.json" --yes

      - name: Push chart to GHCR OCI
        run: helm push dist/*.tgz oci://${{ env.REGISTRY }}/${{ env.CHART_OCI_REPO }}

      - name: Push Artifact Hub metadata
        run: |
          chart_name=$(yq .name "$CHART_DIR/Chart.yaml")
          oras push "${{ env.REGISTRY }}/${{ env.CHART_OCI_REPO }}/${chart_name}:artifacthub.io" \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          is_prerelease="false"
          if [[ "${{ needs.detect.outputs.chart_version }}" == *-* ]]; then
            is_prerelease="true"
          fi
          gh release create "helm-v${{ needs.detect.outputs.chart_version }}" \
            dist/*.tgz \
            dist/*.sigstore.json \
            --notes-file .release_notes \
            --title "helm-v${{ needs.detect.outputs.chart_version }}" \
            --draft \
            $([[ "$is_prerelease" == "true" ]] && echo "--prerelease")
