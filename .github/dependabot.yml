version: 2
updates:
  - package-ecosystem: gomod
    commit-message:
      prefix: chore(deps)
    directory: /
    schedule:
      interval: daily
    groups:
      kubernetes:
        patterns:
          - k8s.io/*
      cert-manager:
        patterns:
          - github.com/cert-manager/*

  - package-ecosystem: github-actions
    commit-message:
      prefix: chore(actions)
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      codeql:
        patterns:
          - "github/codeql-action/*"

  - package-ecosystem: devcontainers
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      devcontainers:
        patterns:
          - "*"

  - package-ecosystem: helm
    commit-message:
      prefix: chore(helm)
    directory: /deploy/helm
    schedule:
      interval: weekly
      day: monday
    groups:
      helm:
        patterns:
          - "*"
